<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title> 3D </title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    
    <style>
        /* Un peu de style pour que ta visionneuse prenne de la place */
        model-viewer {
            width: 100%;
            height: 500px;
            background-color: #f0f0f0; /* Couleur de fond */
        }
    </style>
</head>
<body>

    <h1>Fiole de potion</h1>

    <model-viewer 
        src="./Fiole de potion.glb" 
        camera-controls 
        auto-rotate
        shadow-intensity="1">
    </model-viewer>

</body>
</html>
